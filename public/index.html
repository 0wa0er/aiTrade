<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>盯盘交易台 · 模拟盘</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <b>盯盘台</b>
      <em>模拟交易</em>
    </div>

    <div class="index-strip" id="indexStrip"></div>

    <div class="account-bar" id="accountBar">
      <div class="acc-item"><label>总资产</label><span data-k="totalAsset">--</span></div>
      <div class="acc-item"><label>可用资金</label><span data-k="cash">--</span></div>
      <div class="acc-item"><label>冻结</label><span data-k="frozenCash">--</span></div>
      <div class="acc-item"><label>持仓市值</label><span data-k="marketValue">--</span></div>
      <div class="acc-item"><label>当日盈亏</label><span data-k="dayPnl">--</span></div>
      <div class="acc-item"><label>累计盈亏</label><span data-k="totalPnl">--</span></div>
    </div>

    <div class="clock">
      <span id="liveDot" class="live-dot"></span>
      <span id="sessionTag" class="session-tag" title="交易时段">--</span>
      <span id="clockText">--:--:--</span>
      <button id="btnReset" class="ghost" title="重置模拟账户">重置</button>
    </div>
  </header>

  <div class="middle">

    <aside class="panel watch-panel">
      <div class="panel-head">
        <span>自选</span>
        <div class="head-actions">
          <button id="btnAdd" class="icon" title="添加标的">+</button>
        </div>
      </div>
      <div class="watch-filter">
        <input id="searchInput" type="text" placeholder="搜索代码 / 名称 / 拼音" autocomplete="off" />
        <div id="searchResult" class="search-result hidden"></div>
      </div>
      <div class="watch-table-head">
        <span>名称</span><span>最新价</span><span>涨跌幅</span>
      </div>
      <div id="watchList" class="watch-list"></div>
    </aside>

    <main class="panel chart-panel">
      <div class="quote-head">
        <div class="qh-main">
          <div class="qh-title">
            <h2 id="qName">--</h2>
            <span id="qCode" class="qh-code">--</span>
            <span id="qTag" class="tag"></span>
          </div>
          <div class="qh-price">
            <b id="qPrice">--</b>
            <span id="qChange">--</span>
          </div>
        </div>
        <div class="qh-stats" id="qStats"></div>
      </div>

      <div class="chart-toolbar">
        <div class="tabs" id="chartTabs">
          <button class="tab active" data-kind="trend">分时</button>
          <button class="tab" data-kind="trend5">5日</button>
          <button class="tab" data-kind="day">日K</button>
          <button class="tab" data-kind="week">周K</button>
          <button class="tab" data-kind="month">月K</button>
        </div>
        <div class="chart-tip" id="chartTip"></div>
      </div>

      <div id="chart" class="chart"></div>
    </main>

    <aside class="panel order-panel">
      <div class="order-tabs">
        <button id="tabBuy" class="otab active buy">买入</button>
        <button id="tabSell" class="otab sell">卖出</button>
      </div>

      <div class="order-body">
        <div class="order-type" id="orderType">
          <button class="otype active" data-ot="limit">限价</button>
          <button class="otype" data-ot="market">市价</button>
        </div>

        <div class="field" id="priceField">
          <label id="priceLabel">委托价</label>
          <div class="input-row">
            <input id="inPrice" type="number" step="0.001" min="0" />
            <button class="mini" id="btnLivePrice">现价</button>
          </div>
          <div class="price-range" id="priceRange"></div>
        </div>

        <div class="field" id="qtyField">
          <label>数量（股）</label>
          <div class="input-row">
            <input id="inQty" type="number" step="100" min="0" placeholder="100 的整数倍" />
            <button class="mini" id="btnAllIn">全仓</button>
          </div>
          <div class="quick-row">
            <button data-pct="0.25">1/4</button>
            <button data-pct="0.33">1/3</button>
            <button data-pct="0.5">1/2</button>
            <button data-pct="1">全部</button>
          </div>
        </div>

        <div class="field hidden" id="amountField">
          <label>申购金额（元）</label>
          <div class="input-row">
            <input id="inAmount" type="number" step="100" min="0" placeholder="最低 100 元" />
          </div>
          <div class="quick-row">
            <button data-amt="1000">1000</button>
            <button data-amt="5000">5000</button>
            <button data-amt="10000">10000</button>
            <button data-amt="all">全仓</button>
          </div>
        </div>

        <div class="estimate" id="estimate"></div>

        <button id="btnSubmit" class="submit buy">买入</button>

        <div class="hint" id="orderHint">模拟撮合：委托价即成交价，不收取滑点</div>
      </div>

      <div class="book" id="orderBook">
        <div class="book-head"><span>五档盘口</span><span>价格 / 量(手)</span></div>
        <div id="bookBody" class="book-body"></div>
      </div>
    </aside>
  </div>

  <section class="panel bottom-panel">
    <div class="bottom-head">
      <div class="tabs" id="bottomTabs">
        <button class="tab active" data-view="positions">持仓</button>
        <button class="tab" data-view="orders">委托</button>
        <button class="tab" data-view="trades">成交</button>
        <button class="tab" data-view="rules">交易规则</button>
      </div>
      <div class="bottom-sum" id="bottomSum"></div>
    </div>
    <div class="bottom-body" id="bottomBody"></div>
  </section>

</div>

<div id="toast" class="toast"></div>
<script src="/vendor/echarts.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
